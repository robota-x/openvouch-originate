name: CD Production

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch name or commit SHA to deploy to production"
        required: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: echo "Deploying to production"
