name: CD Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build only
        run: npm run build
        env:
          VITE_SOLANA_RPC_URL: https://api.devnet.solana.com
          VITE_API_BASE_URL: https://api.openvouch-originate.robota.dev
          VITE_IDENTITY_API_BASE_URL: https://identity-attestation.openvouch-originate.robota.dev
          VITE_ATTESTATION_API_BASE_URL: https://company-attestation.openvouch-originate.robota.dev

      - name: Deploy Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lending-website-frontend
          command: deploy --config wrangler.production.jsonc

      - name: Deploy Lending Backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lending-website-backend
          command: |
            d1 migrations apply openvouch-originate-db-production --remote --config wrangler.production.jsonc
            deploy --config wrangler.production.jsonc

      - name: Inject Lending Backend Secrets (Production)
        working-directory: apps/lending-website-backend
        run: |
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --config wrangler.production.jsonc
          echo "$SOLANA_RPC_URL" | npx wrangler secret put SOLANA_RPC_URL --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PRODUCTION }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL_PRODUCTION }}

      - name: Deploy UK Company Service
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/attestation-uk-company-service
          command: |
            d1 migrations apply openvouch-attestation-uk-company-db-production --remote --config wrangler.production.jsonc
            deploy --config wrangler.production.jsonc

      - name: Inject UK Company Service Secrets (Production)
        working-directory: apps/attestation-uk-company-service
        run: echo "$COMPANIES_HOUSE_UK_API_KEY" | npx wrangler secret put COMPANIES_HOUSE_UK_API_KEY --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMPANIES_HOUSE_UK_API_KEY: ${{ secrets.COMPANIES_HOUSE_UK_API_KEY_PRODUCTION }}

      - name: Deploy Identity Service
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/attestation-identity-service
          command: |
            d1 migrations apply openvouch-attestation-identity-db-production --remote --config wrangler.production.jsonc
            deploy --config wrangler.production.jsonc

      - name: Inject Identity Service Secrets (Production)
        working-directory: apps/attestation-identity-service
        run: |
          echo "mock-placeholder" | npx wrangler secret put SHUFTI_CLIENT_ID --config wrangler.production.jsonc
          echo "mock-placeholder" | npx wrangler secret put SHUFTI_SECRET --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
