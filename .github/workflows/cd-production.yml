name: CD Production

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of the image to deploy"
        required: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      # release trigger pins to the tagged commit; workflow_dispatch requires the caller to pass the full SHA
      IMAGE_SHA: ${{ github.sha || inputs.sha }}
    steps:
      - run: echo "Deploying defi-hack/lending-api:${{ env.IMAGE_SHA }} to production"
