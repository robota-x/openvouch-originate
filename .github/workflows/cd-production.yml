name: CD Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    name: Validate and Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CI (Lint, Test, Build)
        run: turbo run lint test build
        env:
          VITE_API_BASE_URL: https://api.openvouch-originate.robota.dev
          VITE_IDENTITY_API_BASE_URL: https://openvouch-attestation-identity-service-production.robota.dev
          VITE_ATTESTATION_API_BASE_URL: https://openvouch-attestation-uk-company-service-production.robota.dev

      - name: Deploy Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lending-website-frontend
          command: deploy --config wrangler.production.jsonc

      - name: Deploy Lending Backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lending-website-backend
          command: |
            d1 migrations apply openvouch-originate-db-production --remote --config wrangler.production.jsonc
            deploy --config wrangler.production.jsonc

      - name: Deploy UK Company Service
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/attestation-uk-company-service
          command: |
            echo "${{ secrets.COMPANIES_HOUSE_UK_API_KEY_PRODUCTION }}" | npx wrangler secret put COMPANIES_HOUSE_UK_API_KEY --config wrangler.production.jsonc
            d1 migrations apply openvouch-attestation-uk-company-db-production --remote --config wrangler.production.jsonc
            deploy --config wrangler.production.jsonc

      - name: Deploy Identity Service
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/attestation-identity-service
          command: |
            echo "mock-placeholder" | npx wrangler secret put SHUFTI_CLIENT_ID --config wrangler.production.jsonc
            echo "mock-placeholder" | npx wrangler secret put SHUFTI_SECRET --config wrangler.production.jsonc
            deploy --config wrangler.production.jsonc
