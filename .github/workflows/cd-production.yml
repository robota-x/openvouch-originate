name: CD Production

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of the image to deploy"
        required: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      # release trigger pins to the tagged commit; workflow_dispatch requires the caller to pass the full SHA
      IMAGE_SHA: ${{ github.sha || inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.openvouch-originate.robota.dev
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-production-${{ github.run_id }}
          path: apps/lending-website-frontend/dist/

  deploy-lending:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build workspace packages for bundling (production)
        run: |
          npm run build --workspace=@openvouch/d1-client
          npm run build --workspace=@openvouch/idl
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-production-${{ github.run_id }}
          path: apps/lending-website-frontend/dist/
      - name: Deploy frontend (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lending-website-frontend
          command: deploy --config wrangler.production.jsonc
      - name: Migrate lending database (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lending-website-backend
          command: d1 migrations apply openvouch-originate-db-production --remote --config wrangler.production.jsonc
      - name: Deploy lending backend (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/lending-website-backend
          command: deploy --config wrangler.production.jsonc

  deploy-attestation:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build workspace packages for bundling (production)
        run: |
          npm run build --workspace=@openvouch/d1-client
          npm run build --workspace=@openvouch/idl
      - name: Sync CH API key secret (production)
        working-directory: apps/attestation-uk-company-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMPANIES_HOUSE_UK_API_KEY: ${{ secrets.COMPANIES_HOUSE_UK_API_KEY_PRODUCTION }}
        run: |
          if [ -z "$COMPANIES_HOUSE_UK_API_KEY" ]; then
            echo "Missing required GitHub secret: COMPANIES_HOUSE_UK_API_KEY_PRODUCTION"
            exit 1
          fi
          echo "$COMPANIES_HOUSE_UK_API_KEY" | npx wrangler secret put COMPANIES_HOUSE_UK_API_KEY --config wrangler.production.jsonc
      - name: Sync email placeholders (production)
        working-directory: apps/attestation-uk-company-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TODO_EMAIL_PLACEHOLDER: "TODO - gonna be deprecated along email"
        run: |
          echo "$TODO_EMAIL_PLACEHOLDER" | npx wrangler secret put SENDGRID_KEY --config wrangler.production.jsonc
          echo "$TODO_EMAIL_PLACEHOLDER" | npx wrangler secret put EMAIL_FROM --config wrangler.production.jsonc
      - name: Migrate attestation database (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/attestation-uk-company-service
          command: d1 migrations apply openvouch-attestation-uk-company-db-production --remote --config wrangler.production.jsonc
      - name: Deploy attestation service (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/attestation-uk-company-service
          command: deploy --config wrangler.production.jsonc

  deploy-identity:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Sync Shufti credentials (production)
        working-directory: apps/attestation-identity-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHUFTI_CLIENT_ID: ${{ secrets.SHUFTI_CLIENT_ID_PRODUCTION }}
          SHUFTI_SECRET: ${{ secrets.SHUFTI_SECRET_PRODUCTION }}
        run: |
          if [ -z "$SHUFTI_CLIENT_ID" ]; then
            echo "Missing required GitHub secret: SHUFTI_CLIENT_ID_PRODUCTION"
            exit 1
          fi
          echo "$SHUFTI_CLIENT_ID" | npx wrangler secret put SHUFTI_CLIENT_ID --config wrangler.production.jsonc
          echo "$SHUFTI_SECRET" | npx wrangler secret put SHUFTI_SECRET --config wrangler.production.jsonc
      - name: Deploy identity service (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/attestation-identity-service
          command: deploy --config wrangler.production.jsonc
