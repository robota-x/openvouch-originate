name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch name or commit SHA to run CI against"
        required: true
        default: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Build lending-api Docker image
        # Tag with full SHA (immutable) and latest (floating) for convenience
        run: |
          docker build \
            -t defi-hack/lending-api:${{ github.sha }} \
            -t defi-hack/lending-api:latest \
            -f apps/lending-api/Dockerfile apps/lending-api
      - name: Push lending-api Docker image
        # SHA tag is the deploy target; latest is a convenience alias
        run: |
          echo "docker push defi-hack/lending-api:${{ github.sha }}"
          echo "docker push defi-hack/lending-api:latest"
