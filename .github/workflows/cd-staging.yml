name: CD Staging

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA of the image to deploy"
        required: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      # workflow_run provides head_sha; workflow_dispatch requires the caller to pass the full SHA
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
    steps:
      - run: echo "Deploying defi-hack/lending-api:${{ env.IMAGE_SHA }} to staging"
