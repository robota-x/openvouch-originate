[package]
name = "dblt_lending"
version = "0.1.0"
description = "DBLT lending Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dblt_lending"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
# Adding solana-program-entrypoint for compatibility with Solana
solana-program-entrypoint = "3.1.1" 

# Anchor-related dependencies
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"

# You can add any other dependencies you need for the program
# Example:
# serde = "1.0"
# borsh = "0.9"