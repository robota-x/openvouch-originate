[package]
name = "dblt_lending"
version = "0.1.0"
description = "DBLT lending Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dblt_lending"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
# Adding solana-program-entrypoint for compatibility with Solana
solana-program-entrypoint = "3.1.1" 
solana-program = "2.1.0"

# Anchor-related dependencies
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"

# SHA-256 hashing for comment integrity verification
sha2 = "0.10"

[dev-dependencies]
solana-program-test = "2.3.13"
solana-sdk = "2.3.1"
tokio = "1.0"