[package]
name = "generic_record"
version = "0.1.0"
description = "Generic two-signer record program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "generic_record"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
